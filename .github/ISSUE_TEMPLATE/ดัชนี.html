<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องค้นหาแผ่นป้ายทะเบียน</title>
    <!-- ใช้ Tailwind CSS เพื่อให้หน้าตาสวยงามและรองรับมือถือ -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-6 text-center">
        <h1 class="text-3xl font-bold">เครื่องค้นหาแผ่นป้ายทะเบียน</h1>
        <p class="text-blue-100 mt-2">ระบบค้นหาป้ายทะเบียนหายหายหรือจากน้ำท่วม</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- ฝั่งซ้าย: ฟอร์มเพิ่มข้อมูล -->
        <section class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2 mb-4">📢 แจ้งข้อมูลป้ายทะเบียน</h2>
            <form id="plateForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ประเภทการแจ้ง</label>
                    <select id="status" class="w-full mt-1 p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="พบเจอ">ตามหาเจ้าของ (เก็บป้ายได้)</option>
                        <option value="ตามหา">ตามหาป้ายทะเบียน (ทำหาย)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">เลขทะเบียนรถ</label>
                    <input type="text" id="plateNumber" placeholder="เช่น กข 1234" required
                           class="w-full mt-1 p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none uppercase">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">จังหวัด</label>
                    <input type="text" id="province" placeholder="เช่น กรุงเทพมหานคร" required
                           class="w-full mt-1 p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">เบอร์ติดต่อกลับ</label>
                    <input type="tel" id="contact" placeholder="เช่น 081-XXXXXXX" required
                           class="w-full mt-1 p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">หมายเหตุ / สถานที่</label>
                    <textarea id="note" rows="2" placeholder="ระบุสถานที่พบ หรือจุดที่คาดว่าหาย..." 
                              class="w-full mt-1 p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition shadow-sm">
                    บันทึกข้อมูล
                </button>
            </form>
        </section>

        <!-- ฝั่งขวา: ค้นหาและตารางแสดงผล -->
        <section class="md:col-span-2 space-y-4">
            
            <!-- กล่องค้นหา -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <input type="text" id="searchBox" placeholder="🔍 พิมพ์เลขทะเบียน หรือจังหวัด เพื่อค้นหา..." 
                           class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex gap-2">
                    <button onclick="renderPlates('ทั้งหมด')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">ทั้งหมด</button>
                    <button onclick="renderPlates('พบเจอ')" class="px-3 py-1 bg-green-100 text-green-700 hover:bg-green-200 rounded-lg text-sm font-medium">เก็บได้</button>
                    <button onclick="renderPlates('ตามหา')" class="px-3 py-1 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg text-sm font-medium">ทำหาย</button>
                </div>
            </div>

            <!-- รายการป้ายทะเบียน -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-4 border-b">
                    <h2 class="text-lg font-bold text-gray-900">📋 รายการในระบบ</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                <th class="p-4">ประเภท</th>
                                <th class="p-4">เลขทะเบียน</th>
                                <th class="p-4">จังหวัด</th>
                                <th class="p-4">ติดต่อ</th>
                                <th class="p-4">หมายเหตุ</th>
                                <th class="p-4 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="plateTableBody" class="divide-y divide-gray-100 text-sm text-gray-600">
                            <!-- ข้อมูลจะถูกใส่ที่นี่ด้วย JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div id="noData" class="p-8 text-center text-gray-400 hidden">
                    ไม่พบข้อมูลป้ายทะเบียนในระบบ
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript สำหรับควบคุมระบบภายในหน้าเดียว -->
    <script>
        // โหลดข้อมูลตัวอย่างเมื่อเปิดระบบครั้งแรก ถ้าไม่มีข้อมูลเก่าอยู่ในเครื่อง
        const defaultData = [
            { id: 1, status: "พบเจอ", plateNumber: "กข 1234", province: "เชียงใหม่", contact: "089-1234567", note: "เจอแถวหน้าเซ็นทรัลเฟสติวัล ตอนน้ำลด" },
            { id: 2, status: "ตามหา", plateNumber: "ชน 999", province: "กรุงเทพมหานคร", contact: "081-9876543", note: "หล่นหายแถววิภาวดีรังสิต" }
        ];

        if (!localStorage.getItem('plates')) {
            localStorage.setItem('plates', JSON.stringify(defaultData));
        }

        // ฟังชันก์ดึงข้อมูลจาก LocalStorage
        function getPlates() {
            return JSON.parse(localStorage.getItem('plates')) || [];
        }

        // ฟังก์ชันแสดงผลข้อมูลลงในตาราง
        function renderPlates(filterStatus = 'ทั้งหมด', searchTerm = '') {
            const plates = getPlates();
            const tbody = document.getElementById('plateTableBody');
            const noData = document.getElementById('noData');
            tbody.innerHTML = '';

            const filteredPlates = plates.filter(plate => {
                const matchesStatus = filterStatus === 'ทั้งหมด' || plate.status === filterStatus;
                const matchesSearch = plate.plateNumber.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      plate.province.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      plate.note.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesStatus && matchesSearch;
            });

            if (filteredPlates.length === 0) {
                noData.classList.remove('hidden');
            } else {
                noData.classList.add('hidden');
                filteredPlates.forEach(plate => {
                    const statusClass = plate.status === 'พบเจอ' 
                        ? 'bg-green-100 text-green-700' 
                        : 'bg-amber-100 text-amber-700';

                    const row = `
                        <tr class="hover:bg-gray-50/50 transition">
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${statusClass}">${plate.status}</span></td>
                            <td class="p-4 font-bold text-gray-900">${plate.plateNumber}</td>
                            <td class="p-4">${plate.province}</td>
                            <td class="p-4 text-blue-600 font-semibold">${plate.contact}</td>
                            <td class="p-4 text-gray-500 max-w-xs truncate" title="${plate.note}">${plate.note || '-'}</td>
                            <td class="p-4 text-center">
                                <button onclick="deletePlate(${plate.id})" class="text-red-500 hover:text-red-700 font-medium text-xs">ลบ</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }
        }

        // จัดการเมื่อผู้ใช้ส่งฟอร์ม (บันทึกข้อมูลใหม่)
        document.getElementById('plateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const plates = getPlates();
            const newPlate = {
                id: Date.now(), // ใช้ timestamp เป็น ID อ้างอิง
                status: document.getElementById('status').value,
                plateNumber: document.getElementById('plateNumber').value,
                province: document.getElementById('province').value,
                contact: document.getElementById('contact').value,
                note: document.getElementById('note').value
            };

            plates.unshift(newPlate); // ใส่ข้อมูลใหม่ไว้ด้านบนสุด
            localStorage.setItem('plates', JSON.stringify(plates));
            
            this.reset(); // เคลียร์ฟอร์ม
            renderPlates(); // อัปเดตตาราง
            alert('บันทึกข้อมูลเรียบร้อยแล้วครับ!');
        });
